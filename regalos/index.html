
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intercambio</title>

    <style>

        :root {
            --red: #a83232;
            --dark-red: #782323;
            --green: #245c43;
            --cream: #fffaf0;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--cream);
            font-family: Arial, sans-serif;
            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        header {
            margin-bottom: 30px;
        }

        .gift-icon {
            font-size: 60px;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--green);
            font-size: 28px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 16px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.07);

            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 18px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: 2px solid var(--green);
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;

            background: var(--red);
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: var(--dark-red);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            text-align: center;
            font-size: 14px;
            margin-top: 18px;
            color: var(--red);
        }

        #result {
            text-align: center;
        }

        .divider {
            border-top: 1px solid #eee;
            margin: 25px 0;
        }

        .result-label {
            color: #777;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        #recipientName {
            color: var(--green);
            font-size: 34px;
            margin: 15px 0;
            overflow-wrap: anywhere;
        }

        .secret-message {
            font-size: 14px;
            color: #777;
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

        [hidden] {
            display: none !important;
        }

    </style>

</head>

<body>

    <main class="container">

        <header>

            <div class="gift-icon">🎁</div>

            <h1>Intercambio De Regalos</h1>

        </header>


        <section class="panel">

            <form id="giftForm">

                <label for="name">
                    Nombre
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Introduce tu nombre"
                    autocomplete="name"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Introduce tu contraseña"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="submitButton"
                >
                    Revelar mi amigo secreto 🎄
                </button>

            </form>


            <p
                id="message"
                role="status"
                aria-live="polite"
            ></p>


            <div id="result" hidden>

                <div class="divider"></div>

                <p class="result-label">
                    TU AMIGO SECRETO ES
                </p>

                <h2 id="recipientName"></h2>

                <p class="secret-message">
                    🤫 ¡Deja el chisme y no se lo digas a nadie!
                </p>

            </div>

        </section>


        <footer>
            Hecho con ❤️ para la familia
        </footer>

    </main>


    <script src="app.js?v=1"></script>

</body>

</html>
