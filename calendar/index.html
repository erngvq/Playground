<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          text-align: center;
          background: #f4f4f4;
      }

      .calendar {
          width: 360px;
          margin: 20px auto;
          background: white;
          padding: 10px 10px 45px 10px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
          position: relative;
      }

      .calendar.dragover {
          outline: 3px dashed #4a90e2;
          background: #eef6ff;
      }

      .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
      }

      .header button {
          padding: 5px 10px;
          cursor: pointer;
      }

      .days, .dates {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
      }

      .days div {
          font-weight: bold;
          padding: 5px 0;
      }

      .dates div {
          padding: 15px 0;
          margin: 2px;
          border-radius: 5px;
      }

      .clickable {
          cursor: pointer;
      }

      .dates div:hover.clickable {
          background: #eee;
      }

      .work {
          background: #c8f7c5;
      }

      .off {
          background: #f7c5c5;
      }

      .weekend {
          background: #ddd;
          color: #666;
      }

      /* Training styles */
      .training-full {
          background: #8ec5ff;
      }

      .training-half-work {
          background: linear-gradient(
                  135deg,
                  #8ec5ff 50%,
                  #c8f7c5 50%
          );
      }

      .training-half-off {
          background: linear-gradient(
                  135deg,
                  #8ec5ff 50%,
                  #f7c5c5 50%
          );
      }

      .half-day-only {
          background: linear-gradient(
                  135deg,
                  #c8f7c5 50%,
                  #dddddd 50%
          );
      }

      /* Bottom controls */
      .bottom-controls {
          position: absolute;
          bottom: 8px;
          left: 0;
          width: 100%;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0 10px;
          box-sizing: border-box;
      }

      .icon-btn {
          background: none;
          border: none;
          font-size: 18px;
          cursor: pointer;
          border-radius: 4px;
          padding: 4px;
      }

      .icon-btn.active {
          background: #4a90e2;
          color: white;
          box-shadow: 0 0 6px rgba(74, 144, 226, 0.6);
      }

      .save-btn {
          padding: 4px 10px;
          cursor: pointer;
      }

      input[type="file"] {
          display: none;
      }
  </style>
</head>
<body>

  <div class="calendar">
    <div class="header">
      <button onclick="changeMonth(-1)">◀</button>
      <h2 id="monthYear"></h2>
      <button onclick="changeMonth(1)">▶</button>
    </div>

    <div class="days">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="dates" id="dates"></div>

    <div class="bottom-controls">
      <label class="icon-btn" title="Load Calendar">
        📂
        <input type="file" accept=".txt" onchange="loadFromFile(event)">
      </label>

      <button class="save-btn" onclick="saveToFile()">Save</button>

      <button id="trainingToggle" class="icon-btn" onclick="toggleTrainingMode()" title="Training Mode">
        🎓
      </button>
    </div>
  </div>

  <script>
      const monthYear = document.getElementById("monthYear");
      const datesContainer = document.getElementById("dates");
      const trainingToggle = document.getElementById("trainingToggle");
      const calendar = document.querySelector(".calendar");

      let currentDate = new Date();
      let data = {};
      let trainingMode = false;

      function toggleTrainingMode() {
          trainingMode = !trainingMode;
          trainingToggle.classList.toggle("active");
      }

      function renderCalendar() {
          datesContainer.innerHTML = "";

          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();

          monthYear.textContent = currentDate.toLocaleString("default", {
              month: "long",
              year: "numeric"
          });

          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();

          for (let i = 0; i < firstDay; i++) {
              datesContainer.appendChild(document.createElement("div"));
          }

          for (let day = 1; day <= daysInMonth; day++) {
              const dateDiv = document.createElement("div");
              dateDiv.textContent = day;

              const fullDate = new Date(year, month, day);
              const dayOfWeek = fullDate.getDay();
              const key = `${year}-${month + 1}-${day}`;
              const status = data[key];

              if (status === "work") {
                  dateDiv.classList.add("work");
              }
              if (status === "off") {
                  dateDiv.classList.add("off");
              }
              if (status === "training-full") {
                  dateDiv.classList.add("training-full");
              }
              if (status === "training-half-work") {
                  dateDiv.classList.add("training-half-work");
              }
              if (status === "training-half-off") {
                  dateDiv.classList.add("training-half-off");
              }
              if (status === "half-day-only") {
                  dateDiv.classList.add("half-day-only");
              }

              if (dayOfWeek === 0) {
                  dateDiv.classList.add("weekend");
              } else {
                  if (dayOfWeek === 6 && !status) {
                      dateDiv.classList.add("weekend");
                  }

                  dateDiv.classList.add("clickable");
                  dateDiv.onclick = () => handleClick(key);
              }

              datesContainer.appendChild(dateDiv);
          }
      }

      function handleClick(key) {

          if (trainingMode) {
              const current = data[key];

              if (!current || current === "work" || current === "off") {
                  data[key] = "half-day-only";
              } else if (current === "half-day-only") {
                  data[key] = "training-half-work";
              } else if (current === "training-half-work") {
                  data[key] = "training-half-off";
              } else if (current === "training-half-off") {
                  data[key] = "training-full";
              } else {
                  data[key] = "half-day-only";
              }
          } else {
              if (!data[key]) {
                  data[key] = "work";
              } else if (data[key] === "work") {
                  data[key] = "off";
              } else {
                  delete data[key];
              }
          }

          renderCalendar();
      }

      function changeMonth(direction) {
          currentDate.setMonth(currentDate.getMonth() + direction);
          renderCalendar();
      }

      function saveToFile() {
          const text = JSON.stringify(data, null, 2);
          const blob = new Blob([text], {type: "text/plain"});
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "calendar.txt";
          link.click();
      }

      function loadFile(file) {
          const reader = new FileReader();

          reader.onload = function (e) {
              try {
                  data = JSON.parse(e.target.result);
                  renderCalendar();
              } catch {
                  alert("Invalid file format.");
              }
          };

          reader.readAsText(file);
      }

      function loadFromFile(event) {
          const file = event.target.files[0];
          if (!file) {
              return;
          }

          loadFile(file);
      }

      // Drag & Drop support
      ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
          calendar.addEventListener(eventName, e => {
              e.preventDefault();
              e.stopPropagation();
          });
      });

      calendar.addEventListener("dragenter", () => {
          calendar.classList.add("dragover");
      });

      calendar.addEventListener("dragleave", () => {
          calendar.classList.remove("dragover");
      });

      calendar.addEventListener("drop", e => {
          calendar.classList.remove("dragover");

          const file = e.dataTransfer.files[0];
          if (!file) {
              return;
          }

          loadFile(file);
      });

      renderCalendar();
  </script>

</body>
</html>
